name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (debug)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Install dsh runtime for smoke test
        shell: pwsh
        run: |
          npm install -g "@deepseek-ai/dsh@0.1.1-rc.2"
          dsh --version

      - name: Smoke test (boot → ready → graceful exit, no orphans)
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dsh-smoke-home
        run: |
          New-Item -ItemType Directory -Force -Path $env:DSH_HOME | Out-Null
          $exe = "src-tauri\target\debug\dsh-desktop.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--quit-after-secs","240" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "smoke: app exit code $($p.ExitCode)" }
          $log = Join-Path $env:LOCALAPPDATA "dsh-desktop-app-data\dsh-desktop.log"
          if (-not (Select-String -Path $log -Pattern "dsh web: http://127\.0\.0\.1:\d+" -Quiet)) {
            throw "smoke: no URL line in log"
          }
          Write-Host "smoke OK"

      - name: Portable-mode smoke (USB layout → DSH_HOME redirect → wizard gating)
        shell: pwsh
        run: |
          # 伪造U盘便携目录：exe + Data/node（runner node + npm -g dsh）+ Data/home
          $usb = Join-Path $env:RUNNER_TEMP "fake-usb"
          New-Item -ItemType Directory -Force -Path "$usb\Data\home","$usb\Data\node" | Out-Null
          Copy-Item "src-tauri\target\debug\dsh-desktop.exe" $usb
          Copy-Item (Get-Command node.exe).Source "$usb\Data\node\node.exe"
          npm install -g "@deepseek-ai/dsh@0.1.1-rc.2" --prefix "$usb\Data\node" --no-progress
          # 完成标记：跳过向导直接启动（向导 UI 由本地验收覆盖）
          Set-Content "$usb\Data\home\persona-configured.json" '{"configured":true,"owner":"ci"}'
          # 宿主侧基准：记录本次冒烟前宿主 ~/.dsh 是否已有 profiles/web
          $hostWeb = Test-Path (Join-Path $env:USERPROFILE ".dsh\profiles\web")
          $p = Start-Process -FilePath "$usb\dsh-desktop.exe" -ArgumentList "--quit-after-secs","150" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "portable smoke: exit code $($p.ExitCode)" }
          $log = "$usb\Data\dsh-desktop.log"
          if (-not (Test-Path $log)) { throw "portable smoke: no log in Data" }
          if (-not (Select-String -Path $log -Pattern "dsh web: http://127\.0\.0\.1:\d+" -Quiet)) {
            throw "portable smoke: no URL line in Data log"
          }
          if (-not (Test-Path "$usb\Data\home\profiles")) {
            throw "portable smoke: DSH_HOME not redirected (no profiles under Data/home)"
          }
          Write-Host "portable smoke OK"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-smoke
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - msbuild_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.msbuild_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build NSIS installer + updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DSH Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.msbuild_target }} --bundles nsis

      - name: Build portable app zip (U盘便携包的应用层)
        shell: pwsh
        run: |
          # NSIS 静默安装到临时目录，取其实际落盘文件（exe + WebView2 加载器等），
          # 去掉卸载器后压缩为便携应用 zip——分发给 make-portable / 直接解压即用
          $nsis = Get-ChildItem "src-tauri\target\${{ matrix.msbuild_target }}\release\bundle\nsis\*-setup.exe" |
            Select-Object -First 1
          if (-not $nsis) { $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1 }
          if (-not $nsis) { throw "NSIS installer not found" }
          $instDir = Join-Path $env:RUNNER_TEMP "portable-install"
          New-Item -ItemType Directory -Force -Path $instDir | Out-Null
          Start-Process -FilePath $nsis.FullName -ArgumentList "/S" -Wait
          $appDir = Join-Path $env:LOCALAPPDATA "DSH-Desktop"
          if (-not (Test-Path (Join-Path $appDir "DSH-Desktop.exe"))) {
            throw "silent install did not produce DSH-Desktop.exe"
          }
          $stage = Join-Path $env:RUNNER_TEMP "portable-stage\DSH-Desktop"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$appDir\*" $stage -Recurse -Force
          Get-ChildItem $stage -Filter "uninstall*.exe" -Recurse | Remove-Item -Force
          Get-ChildItem $stage -Filter "nsis-*.exe" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          $zip = Join-Path $env:RUNNER_TEMP "DSH-Desktop_Portable_${{ github.ref_name }}_x64.zip"
          Compress-Archive -Path (Join-Path $env:RUNNER_TEMP "portable-stage\*") -DestinationPath $zip -Force
          Write-Host "portable zip: $zip ($((Get-Item $zip).Length / 1MB) MB)"
          "portable_zip=$zip" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Attach portable zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.portable_zip }}
