name: macOS CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (debug)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Install Node 24 + dsh for smoke test
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dsh
        run: |
          npm install -g "@deepseek-ai/dsh@0.1.2-alpha.5"
          dsh --version

      - name: Smoke test (boot → ready → graceful exit, no orphans)
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-smoke-home
        run: |
          mkdir -p "$DSH_HOME"
          src-tauri/target/debug/dsh-desktop --quit-after-secs 240 &
          APP_PID=$!
          wait $APP_PID
          EXIT=$?
          if [ "$EXIT" -ne 0 ]; then echo "smoke: app exit code $EXIT"; exit 1; fi
          LOG="$HOME/Library/Application Support/dsh-desktop-app-data/dsh-desktop.log"
          if ! grep -qE 'dsh web: http://127\.0\.0\.1:[0-9]+' "$LOG"; then
            echo "smoke: no URL line in log"; exit 1
          fi
          echo "smoke OK"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-smoke
    runs-on: macos-latest
    permissions:
      contents: write
    # 矩阵出两份 dmg：Apple Silicon + Intel 各一，放进同一个 Release。v0.1.30 曾尝试用
    # --target universal-apple-darwin 一个 dmg 覆盖双芯片，tauri-action@v0 当前解析的版本
    # 不支持该参数（在 action 输入校验阶段就失败，整个 release 跑成 0 jobs / failure）。
    # 改用社区广泛验证的「aarch64 + x86_64 各打一份」模式（dev.to 官方实践文章推荐），
    # updater 的 latest.json 由 tauri-action 自动覆盖双架构，Intel/Apple Silicon
    # 自动更新同源。文件比 universal 大约小一半（无重复代码段），代价是 Release 多一个附件。
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/sync-version.py "${{ github.ref_name }}"

      - name: Build dmg + updater artifacts (${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DSH Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.arch }} --bundles app,dmg
