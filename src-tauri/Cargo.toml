[package]
name = "dsh-desktop"
version = "0.1.24"
description = "DSH Desktop — DeepSeek Harness 桌面应用（Windows / macOS）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tungstenite = "0.26"
# 本地回环反向代理（remote_proxy.rs）专用：与图中已锁定的 1.53.1 统一，
# 不新增第三方依赖。macros 仅为 #[tokio::test] 测试所需。
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-decorum = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
