[package]
name = "dsh-desktop"
version = "0.1.30"
description = "DSH Desktop — DeepSeek Harness 桌面应用（Windows / macOS）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tungstenite = "0.26"
# 本地回环反向代理（remote_proxy.rs）专用：与图中已锁定的 1.53.1 统一，
# 不新增第三方依赖。macros 仅为 #[tokio::test] 测试所需。
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-decorum = "1"

# Windows JumpList（D3b）：ICustomDestinationList COM 的类型化封装，GUID/接口全部来自
# crate 自身（不手写 vtable / 不猜 GUID）。仅 Windows 目标编译。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

# macOS Dock badge（D3b）：NSApp.dockTile.badgeLabel 的最小 msg_send 封装。仅 macOS 目标编译。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
