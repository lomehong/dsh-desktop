<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>远程实例 · 御符账号</title>
<style>
  /* ── 设计令牌：跟随系统深浅色（与主窗口一致，窗口内不再提供主题切换）。
     主色对齐主窗口品牌渐变 #4a6cf7 → #7b5cf0；间距 4px 栅格；
     圆角两档（10 卡片/行、14 对话框）；边框弱化、以阴影分层 ── */
  :root {
    color-scheme: light;
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-hover: #eef1f6;
    --border: #e4e8ee;
    --border-strong: #cdd4de;
    --text-1: #131824;
    --text-2: #4c5666;
    --text-3: #8a93a5;
    --accent: #4a6cf7;
    --accent-strong: #3b5ce6;
    --accent-soft: rgba(74, 108, 247, .09);
    --accent-shadow: rgba(74, 108, 247, .28);
    --grad: linear-gradient(135deg, #4a6cf7, #7b5cf0);
    --ok: #15803d;
    --ok-soft: rgba(21, 128, 61, .08);
    --ok-border: rgba(21, 128, 61, .3);
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, .07);
    --danger-border: rgba(220, 38, 38, .28);
    --skeleton: #e9edf2;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-md: 0 8px 24px rgba(16, 24, 40, .1);
    --shadow-lg: 0 24px 64px rgba(16, 24, 40, .22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --surface: #161a22;
      --surface-hover: #1d232e;
      --border: #262d3a;
      --border-strong: #384152;
      --text-1: #e8ebf2;
      --text-2: #9aa4b5;
      --text-3: #69738a;
      --accent: #7b9bff;
      --accent-strong: #93aeff;
      --accent-soft: rgba(123, 155, 255, .12);
      --accent-shadow: rgba(74, 108, 247, .4);
      --ok: #45c48a;
      --ok-soft: rgba(69, 196, 138, .1);
      --ok-border: rgba(69, 196, 138, .3);
      --danger: #ef6b6b;
      --danger-soft: rgba(239, 107, 107, .1);
      --danger-border: rgba(239, 107, 107, .3);
      --skeleton: #1d232e;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, .4);
      --shadow-lg: 0 24px 64px rgba(0, 0, 0, .55);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; flex-direction: column;
    font-family: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    font-size: 13px; line-height: 1.5; color: var(--text-1);
    background: var(--bg);
    user-select: none;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  body.mac .titlebar { padding-left: 84px; } /* macOS 红绿灯在左，预留按钮区 */

  /* ── 标题栏（无边框窗口：拖拽区 + 刷新钮 + 自绘窗控钮） ── */
  .titlebar {
    flex: none; display: flex; align-items: center; gap: 12px;
    height: 48px; padding: 0 0 0 16px;
    border-bottom: 1px solid var(--border); background: var(--surface);
    user-select: none;
    -webkit-app-region: drag; /* Tauri 内核拖拽（配合 data-tauri-drag-region 属性双保险） */
  }
  .titlebar button { -webkit-app-region: no-drag; }

  /* ── 自绘窗控按钮（无边框窗口；不用 decorum——懒创建窗口里它的注入事件竞态丢失） ── */
  .win-controls { display: flex; height: 48px; align-self: stretch; }
  .win-btn {
    width: 46px; height: 100%; border: none; border-radius: 0; background: none; cursor: pointer;
    color: var(--text-2); display: grid; place-items: center;
    -webkit-app-region: no-drag;
    transition: background .1s, color .1s;
    padding: 0;
  }
  .win-btn:hover { background: var(--surface-hover); color: var(--text-1); border: none; }
  .win-btn.close:hover { background: #e81123; color: #fff; }
  .win-btn svg { width: 12px; height: 12px; }
  .titlebar .glyph {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    background: var(--grad);
    box-shadow: 0 2px 8px var(--accent-shadow);
    display: grid; place-items: center;
  }
  .titlebar .glyph svg { width: 15px; height: 15px; }
  .titlebar .t { flex: 1; min-width: 0; }
  .titlebar h1 { font-size: 13px; font-weight: 650; margin: 0; }
  .titlebar .sub { color: var(--text-3); font-size: 11px; margin-top: 1px; }
  .titlebar .btns { display: flex; gap: 4px; }
  /* 幽灵图标钮：无边框无底，悬停才浮现底色（与窗控钮同族） */
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    border: none; background: none; color: var(--text-2);
    display: grid; place-items: center;
    transition: background .12s, color .12s;
    padding: 0;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text-1); border: none; }
  .icon-btn svg { width: 15px; height: 15px; }
  /* 刷新中只旋转箭头——类名须避开 .spin（圆形加载圈），否则按钮自身会被命中成圆圈 */
  .icon-btn.spinning svg { animation: r .8s linear infinite; }

  /* ── 内容滚动区 ── */
  main { flex: 1; overflow-y: auto; padding: 18px 22px 10px; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb {
    background: var(--border-strong); border-radius: 6px;
    border: 3px solid var(--bg); background-clip: padding-box;
  }
  section { margin-bottom: 20px; }
  .sec-h { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 8px; }
  .sec-h h2 { font-size: 12px; font-weight: 650; margin: 0; color: var(--text-2); letter-spacing: .3px; }
  .sec-h .muted { font-size: 11px; }

  /* ── 实例行：弱边框 + 浅阴影分层，悬停微浮起 ── */
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li.row {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    box-shadow: var(--shadow-sm);
    transition: border-color .14s, background .14s, box-shadow .14s, transform .14s;
  }
  li.row:hover {
    border-color: var(--border-strong); background: var(--surface);
    box-shadow: var(--shadow-md); transform: translateY(-1px);
  }
  li.row.current { border-color: var(--ok-border); background: var(--ok-soft); }
  li.row.current:hover { box-shadow: var(--shadow-sm); transform: none; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--text-3); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .dot.dim { background: var(--border-strong); }
  /* 品牌渐变头像：与主窗口 logo 同源，跨窗口视觉一致 */
  .glyph2 {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: var(--grad); color: #fff;
    display: grid; place-items: center; font-weight: 650; font-size: 14px;
  }
  .meta { flex: 1; min-width: 0; }
  .meta .name { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .meta .name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .desc { color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill {
    font-size: 11px; border-radius: 999px; padding: 0 8px; line-height: 18px; flex: none;
    border: 1px solid var(--border); color: var(--text-3); background: var(--surface);
  }
  .pill.ok { border-color: var(--ok-border); color: var(--ok); background: var(--ok-soft); }

  /* ── 账号卡 ── */
  .account { display: flex; align-items: center; gap: 12px; }
  .account-chip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--ok-border); background: var(--ok-soft);
    color: var(--ok); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 600;
  }
  .account-chip .avatar {
    width: 22px; height: 22px; border-radius: 50%; background: var(--ok);
    color: #fff; display: grid; place-items: center; font-size: 12px;
  }
  .account-chip small { font-weight: 400; color: var(--text-3); }

  /* ── 按钮 ── */
  button {
    font: inherit; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-1); border-radius: 8px; padding: 6px 14px; cursor: pointer;
    transition: color .12s, border-color .12s, background .12s, box-shadow .12s, filter .12s;
    flex: none;
  }
  button:hover { background: var(--surface-hover); }
  button.primary {
    background: var(--grad); border: none; color: #fff; font-weight: 600;
    box-shadow: 0 3px 10px var(--accent-shadow);
  }
  button.primary:hover { background: var(--grad); filter: brightness(1.07); box-shadow: 0 5px 14px var(--accent-shadow); }
  button.ghost-danger { border-color: transparent; background: none; color: var(--text-3); }
  button.ghost-danger:hover { color: var(--danger); background: var(--danger-soft); }
  button.sm { padding: 4px 12px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* ── 状态与空态 ── */
  .muted { color: var(--text-3); font-size: 12px; }
  .empty { padding: 26px 12px 22px; text-align: center; }
  .empty-ico {
    width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 10px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center;
  }
  .empty-ico svg { width: 22px; height: 22px; }
  .empty p { margin: 0 0 12px; color: var(--text-3); font-size: 12px; }
  .empty h3 { margin: 0 0 3px; font-size: 13px; font-weight: 600; color: var(--text-2); }
  .msg { display: none; border-radius: 10px; padding: 9px 12px; font-size: 12px; margin: 8px 0; }
  .msg.show { display: block; }
  .msg.err { display: block; background: var(--danger-soft); border: 1px solid var(--danger-border); color: var(--danger); white-space: pre-wrap; }
  .msg.ok { display: block; background: var(--ok-soft); border: 1px solid var(--ok-border); color: var(--ok); }
  .msg.muted { display: block; border: 1px solid var(--border); color: var(--text-2); background: var(--surface); }
  .spin {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border-strong);
    border-top-color: var(--accent); border-radius: 50%;
    animation: r .8s linear infinite; vertical-align: -2px; margin-right: 6px;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .skel { display: flex; align-items: center; gap: 12px; height: 54px; }
  .skel .g { width: 34px; height: 34px; border-radius: 9px; background: var(--skeleton); animation: pulse 1.4s ease infinite; flex: none; }
  .skel .bars { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .skel .b { height: 10px; border-radius: 4px; background: var(--skeleton); animation: pulse 1.4s ease infinite; }
  .skel .b.w1 { width: 58%; }
  .skel .b.w2 { width: 82%; }
  .skel + .skel { margin-top: 8px; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

  /* ── 底部操作栏（钉底） ── */
  .footbar {
    flex: none; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 22px; border-top: 1px solid var(--border); background: var(--surface);
  }
  .footbar .spacer { flex: 1; }

  /* ── 对话框 ── */
  dialog {
    background: var(--surface); color: var(--text-1);
    border: 1px solid var(--border); border-radius: 14px; padding: 22px;
    width: 92%; box-shadow: var(--shadow-lg);
  }
  dialog::backdrop { background: rgba(8, 10, 14, .5); backdrop-filter: blur(3px); }
  dialog h3 { margin: 0 0 10px; font-size: 14px; }
  .dlg-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .hint { color: var(--text-3); font-size: 12px; margin: 6px 0; }
</style>
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="glyph" data-tauri-drag-region aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="6" rx="2"/><rect x="2" y="15" width="20" height="6" rx="2"/>
        <circle cx="6" cy="6" r=".5" fill="#fff"/><circle cx="6" cy="18" r=".5" fill="#fff"/>
      </svg>
    </div>
    <div class="t" data-tauri-drag-region>
      <h1 data-tauri-drag-region>远程实例</h1>
      <div class="sub" data-tauri-drag-region>御符账号 · 发现并直连名下 dsh 实例</div>
    </div>
    <div class="btns">
      <button class="icon-btn" id="btnRefresh" aria-label="刷新清单" title="刷新清单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </div>
    <!-- 自绘窗控钮（不用 decorum——懒创建窗口里它的 page-load 注入事件竞态丢失） -->
    <div class="win-controls">
      <button class="win-btn" id="winMin" aria-label="最小化" title="最小化">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="1" y1="6" x2="11" y2="6"/></svg>
      </button>
      <button class="win-btn" id="winMax" aria-label="最大化/还原" title="最大化/还原">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>
      </button>
      <button class="win-btn close" id="winClose" aria-label="关闭" title="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section aria-labelledby="hAccount">
      <div class="sec-h"><h2 id="hAccount">账号</h2></div>
      <ul class="list" role="list">
        <li class="row" style="padding:12px 14px">
          <div class="glyph2" aria-hidden="true">符</div>
          <div class="meta">
            <div id="loginArea" class="muted">加载中…</div>
          </div>
          <div class="foot" id="loginActions" style="margin:0"></div>
        </li>
      </ul>
    </section>

    <section aria-labelledby="hCached">
      <div class="sec-h"><h2 id="hCached">本机凭据</h2><span class="muted">离线可连</span></div>
      <ul class="list" id="cachedList" role="list" aria-label="本机凭据实例"></ul>
    </section>

    <section aria-labelledby="hCloud">
      <div class="sec-h"><h2 id="hCloud">云端实例</h2><span class="muted">御符账号名下 · 仅显示可连的 dsh 实例</span></div>
      <ul class="list" id="cloudList" role="list" aria-label="云端实例"></ul>
    </section>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </main>

  <footer class="footbar">
    <button id="btnManual" class="sm">手动配对（兼容旧流程）</button>
    <button id="btnToLocal" class="sm">切回本地</button>
    <div class="spacer"></div>
    <button id="btnClear" class="sm ghost-danger">清除当前凭据</button>
  </footer>

  <dialog id="tofuDlg">
    <h3>首次连接确认（TOFU）</h3>
    <p class="hint" id="tofuAddr"></p>
    <p class="hint">这是你第一次连接该地址。请确认它属于你的实例——继续后该地址将被记住，不再询问。</p>
    <div class="dlg-btns">
      <button id="tofuCancel">取消</button>
      <button id="tofuOk" class="primary" autofocus>确认并连接</button>
    </div>
  </dialog>

  <script>
    const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
    const $ = (id) => document.getElementById(id);
    const state = { pendingAddress: null, busy: false };

    if (/Mac/i.test(navigator.userAgent)) document.body.classList.add('mac');

    /* ── 自绘窗控钮（无边框窗口；__TAURI__.window 全局可用） ── */
    const selfWin = window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow
      ? window.__TAURI__.window.getCurrentWindow() : null;
    if (selfWin) {
      $('winMin').onclick = () => selfWin.minimize();
      $('winMax').onclick = () => selfWin.toggleMaximize();
      $('winClose').onclick = () => selfWin.close();
    }

    function msg(text, cls) {
      const el = $('msg');
      el.className = text ? `msg show ${cls || 'err'}` : 'msg';
      el.textContent = text || '';
    }
    function setBusy(on, label) {
      state.busy = on;
      for (const b of document.querySelectorAll('button')) b.disabled = on;
      if (!on) { for (const b of document.querySelectorAll('button')) b.disabled = false; }
      if (on && label) msg(label, 'muted');
    }
    function skeleton(count) {
      const wrap = document.createElement('div'); wrap.setAttribute('aria-busy', 'true');
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div'); s.className = 'skel';
        s.innerHTML = `<div class="g"></div><div class="bars"><div class="b w1"></div><div class="b w2"></div></div>`;
        wrap.appendChild(s);
      }
      return wrap;
    }
    function emptyState(title, text, action) {
      const d = document.createElement('div'); d.className = 'empty';
      d.innerHTML = `<div class="empty-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="6" rx="2"/><rect x="2" y="15" width="20" height="6" rx="2"/><circle cx="6" cy="6" r=".5" fill="currentColor"/><circle cx="6" cy="18" r=".5" fill="currentColor"/></svg></div><h3></h3><p></p>`;
      d.querySelector('h3').textContent = title;
      d.querySelector('p').textContent = text;
      if (action) d.appendChild(action);
      return d;
    }
    function hostInitial(name) { return (name || '·').trim().charAt(0).toUpperCase() || '·'; }
    function rowShell(dotState, initial) {
      const row = document.createElement('li'); row.className = 'row';
      const dot = document.createElement('span'); dot.className = `dot ${dotState}`; dot.setAttribute('aria-hidden', 'true');
      row.appendChild(dot);
      const g = document.createElement('div'); g.className = 'glyph2'; g.setAttribute('aria-hidden', 'true');
      g.textContent = initial; row.appendChild(g);
      const meta = document.createElement('div'); meta.className = 'meta'; row.appendChild(meta);
      return { row, meta };
    }

    async function refresh() {
      if (state.busy) return;
      $('btnRefresh').classList.add('spinning');
      try {
        const data = await invoke('remote_instances');
        render(data);
      } catch (e) { msg(String(e)); }
      $('btnRefresh').classList.remove('spinning');
    }

    function render(data) {
      // ── 账号 ──
      const la = $('loginArea'); const lb = $('loginActions'); lb.innerHTML = '';
      if (data.loggedIn) {
        la.className = '';
        la.innerHTML = `<span class="account-chip"><span class="avatar">符</span>御符账号已登录 <small>· 凭证仅存于本进程内存</small></span>`;
        const out = document.createElement('button'); out.className = 'sm'; out.textContent = '登出';
        out.onclick = async () => { try { await invoke('remote_logout'); await refresh(); } catch (e) { msg(String(e)); } };
        lb.appendChild(out);
      } else {
        la.className = 'muted';
        la.textContent = '未登录';
        const btn = document.createElement('button'); btn.className = 'primary sm'; btn.textContent = '使用御符账号登录';
        btn.onclick = () => doLogin();
        lb.appendChild(btn);
      }
      // ── 本机凭据段 ──
      const cl = $('cachedList'); cl.innerHTML = '';
      if (!data.cached || data.cached.length === 0) {
        cl.appendChild(emptyState('暂无本机凭据', '连接过的实例会出现在这里，离线也能重连。'));
      }
      for (const c of data.cached || []) {
        const { row, meta } = rowShell(c.current ? 'ok' : 'dim', '⌂');
        row.classList.toggle('current', !!c.current);
        meta.innerHTML = `<div class="name"><span class="nm">${escapeHtml(c.address)}</span>${c.current ? '<span class="pill ok">已连接</span>' : ''}</div>`
          + `<div class="desc">${escapeHtml(c.origin)}</div>`;
        const sw = document.createElement('button'); sw.className = 'sm';
        sw.textContent = c.current ? '重连' : '连接';
        sw.onclick = () => connectCached(c.address);
        row.appendChild(sw);
        cl.appendChild(row);
      }
      // ── 云端段 ──
      const ul = $('cloudList'); ul.innerHTML = '';
      if (!data.loggedIn) {
        const loginHere = document.createElement('button'); loginHere.className = 'primary sm';
        loginHere.textContent = '使用御符账号登录';
        loginHere.onclick = () => doLogin();
        ul.appendChild(emptyState('未登录', '登录后展示御符账号名下可连的 dsh 实例。', loginHere));
        return;
      }
      if (!data.cloud || data.cloud.length === 0) {
        const manual = document.createElement('button'); manual.className = 'sm';
        manual.textContent = '手动配对';
        manual.onclick = () => { try { invoke('remote_show_legacy_connect'); } catch (e) { msg(String(e)); } };
        ul.appendChild(emptyState('暂无可连实例', '仅显示已安装 dsh-remote 并开启远程访问的实例。', manual));
        return;
      }
      for (const inst of data.cloud) {
        const addr = inst.address || '';
        const offline = !addr;
        const alive = inst.alive === true;
        const name = inst.name || inst.hostname || inst.instanceId;
        const { row, meta } = rowShell(offline ? 'dim' : (alive ? 'ok' : 'dim'), hostInitial(name));
        const statusPill = offline
          ? '<span class="pill">未开启远程访问</span>'
          : (alive ? '<span class="pill ok">在线</span>' : '<span class="pill">探活中</span>');
        meta.innerHTML = `<div class="name"><span class="nm">${escapeHtml(name)}</span>${statusPill}</div>`
          + `<div class="desc">${escapeHtml(inst.hostname || '')}${addr ? ' · ' + escapeHtml(addr) : ''} · agent×${inst.agentCount ?? '?'}</div>`;
        const btn = document.createElement('button'); btn.className = 'sm primary';
        if (offline) { btn.textContent = '不可连'; btn.disabled = true; btn.setAttribute('aria-disabled', 'true'); }
        else { btn.textContent = '连接'; btn.onclick = () => connectCloud(inst.address); }
        row.appendChild(btn);
        ul.appendChild(row);
      }
    }

    async function doLogin() {
      if (state.busy) return;
      setBusy(true, '');
      msg('正在打开御符登录页…请在浏览器完成认证（最长等 300 秒）', 'muted');
      const spin = document.createElement('span'); spin.className = 'spin'; $('msg').appendChild(spin);
      try {
        await invoke('remote_login');
        msg(''); await refresh();
      } catch (e) { msg(String(e)); }
      setBusy(false);
      await refresh();
    }

    async function connectCached(address) {
      // 缓存实例凭据已在本地：直接走既有连接流（不经历 exchange）
      try {
        await invoke('remote_connect_instance', { address, confirmTofu: true }); // 本机既有凭据视为已确认
        msg('已发起连接，主窗口将跳转…', 'ok');
      } catch (e) { msg(String(e)); }
    }

    async function connectCloud(address) {
      if (state.busy) return;
      state.pendingAddress = address;
      try {
        setBusy(true, '正在用账号身份换取实例凭据…');
        const r = await invoke('remote_connect_instance', { address, confirmTofu: false });
        msg(r + ' 主窗口将跳转远程实例页面。', 'ok');
      } catch (e) {
        const text = String(e);
        if (text.includes('TOFU_REQUIRED')) {
          $('tofuAddr').textContent = '地址：' + address;
          $('tofuDlg').showModal();
        } else msg(text);
      } finally { setBusy(false); }
    }

    $('tofuOk').onclick = async () => {
      $('tofuDlg').close();
      const addr = state.pendingAddress; if (!addr) return;
      try {
        setBusy(true, '已确认地址，正在换取实例凭据…');
        const r = await invoke('remote_connect_instance', { address: addr, confirmTofu: true });
        msg(r + ' 主窗口将跳转远程实例页面。', 'ok');
      } catch (e) { msg(String(e)); }
      setBusy(false);
    };
    $('tofuCancel').onclick = () => { $('tofuDlg').close(); state.pendingAddress = null; };

    $('btnRefresh').onclick = () => refresh();
    $('btnManual').onclick = async () => { try { await invoke('remote_show_legacy_connect'); } catch (e) { msg(String(e)); } };
    $('btnToLocal').onclick = async () => { try { await invoke('switch_to_local'); msg('已切回本地模式', 'ok'); await refresh(); } catch (e) { msg(String(e)); } };
    $('btnClear').onclick = async () => {
      if (!confirm('确定清除当前远程实例凭据？清除后需重新登录/配对才能连接。')) return;
      try { await invoke('remote_clear_credentials'); msg('凭据已清除', 'ok'); await refresh(); } catch (e) { msg(String(e)); }
    };

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    // 首屏骨架屏（首次数据到达前占位）
    $('cachedList').appendChild(skeleton(2));
    $('cloudList').appendChild(skeleton(2));
    refresh();
  </script>
</body>
</html>
