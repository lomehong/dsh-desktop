<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>关于 DSH Desktop</title>
<style>
  /* ── 设计令牌：与 settings.html / remote.html 同源（跟随系统深浅色，品牌渐变 #4a6cf7 → #7b5cf0） ── */
  :root {
    color-scheme: light;
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-hover: #eef1f6;
    --border: #e4e8ee;
    --border-strong: #cdd4de;
    --text-1: #131824;
    --text-2: #4c5666;
    --text-3: #8a93a5;
    --accent: #4a6cf7;
    --accent-soft: rgba(74, 108, 247, .09);
    --accent-shadow: rgba(74, 108, 247, .28);
    --grad: linear-gradient(135deg, #4a6cf7, #7b5cf0);
    --ok: #15803d;
    --err: #dc2626;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --surface: #161a22;
      --surface-hover: #1d232e;
      --border: #262d3a;
      --border-strong: #384152;
      --text-1: #e8ebf2;
      --text-2: #9aa4b5;
      --text-3: #69738a;
      --accent: #7b9bff;
      --accent-soft: rgba(123, 155, 255, .12);
      --accent-shadow: rgba(74, 108, 247, .4);
      --ok: #45c48a;
      --err: #f87171;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; flex-direction: column;
    font-family: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    font-size: 13px; line-height: 1.5; color: var(--text-1);
    background: var(--bg);
    user-select: none;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ── 标题栏（无边框窗口：拖拽区 + 自绘关闭钮） ── */
  .titlebar {
    flex: none; display: flex; align-items: center; gap: 12px;
    height: 48px; padding: 0 0 0 16px;
    border-bottom: 1px solid var(--border); background: var(--surface);
    user-select: none;
    -webkit-app-region: drag; /* Tauri 内核拖拽（配合 data-tauri-drag-region 属性双保险） */
  }
  .titlebar button { -webkit-app-region: no-drag; }
  .titlebar .t { flex: 1; min-width: 0; }
  .titlebar h1 { font-size: 13px; font-weight: 650; margin: 0; }
  .win-controls { display: flex; height: 48px; align-self: stretch; }
  .win-btn {
    width: 46px; height: 100%; border: none; border-radius: 0; background: none; cursor: pointer;
    color: var(--text-2); display: grid; place-items: center;
    -webkit-app-region: no-drag;
    transition: background .1s, color .1s;
    padding: 0;
  }
  .win-btn:hover { background: var(--surface-hover); color: var(--text-1); border: none; }
  .win-btn.close:hover { background: #e81123; color: #fff; }
  .win-btn svg { width: 12px; height: 12px; }
  /* macOS：Overlay 标题栏自带红绿灯，隐藏自绘钮（避免双关闭钮）；红绿灯在左，标题让其位 */
  body.mac .titlebar { padding-left: 84px; }
  body.mac .win-controls { display: none; }

  /* ── 内容区（固定尺寸窗口：内容超高时滚动兜底） ── */
  main { flex: 1; overflow-y: auto; padding: 20px 22px 18px; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb {
    background: var(--border-strong); border-radius: 6px;
    border: 3px solid var(--bg); background-clip: padding-box;
  }

  /* Hero：品牌标识 + 名称 */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 20px; }
  .logo {
    width: 64px; height: 64px; border-radius: 18px; margin-bottom: 12px;
    background: var(--grad); box-shadow: 0 6px 20px var(--accent-shadow);
    display: grid; place-items: center;
  }
  .logo svg { width: 34px; height: 34px; }
  .hero .name { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  .hero .tagline { color: var(--text-3); font-size: 12px; margin-top: 3px; }

  .card {
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    box-shadow: var(--shadow-sm); padding: 6px 14px;
  }
  .kv { display: flex; gap: 12px; padding: 8px 2px; }
  .kv + .kv { border-top: 1px solid var(--border); }
  .kv .k { width: 96px; flex: none; color: var(--text-3); font-size: 12px; padding-top: 1px; }
  .kv .v { flex: 1; min-width: 0; word-break: break-all; user-select: text; }

  button {
    font: inherit; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-1); border-radius: 8px; padding: 6px 16px; cursor: pointer;
    transition: color .12s, border-color .12s, background .12s;
  }
  button:hover { background: var(--surface-hover); }
  button.primary {
    border: none; background: var(--grad); color: #fff; font-weight: 600;
    box-shadow: 0 2px 8px var(--accent-shadow);
  }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }
  button[hidden] { display: none; }

  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .row.center { justify-content: center; }
  .msg { font-size: 12px; color: var(--text-3); }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  .note { margin: 14px 2px 0; font-size: 11.5px; color: var(--text-3); line-height: 1.6; }
</style>
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="t" data-tauri-drag-region>
      <h1 data-tauri-drag-region>关于 DSH Desktop</h1>
    </div>
    <!-- 自绘窗控钮（无边框窗口；仅关闭——固定尺寸面板，最小化/最大化无意义） -->
    <div class="win-controls">
      <button class="win-btn close" id="winClose" aria-label="关闭" title="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="hero">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="6" rx="2"/><rect x="2" y="15" width="20" height="6" rx="2"/>
          <circle cx="6" cy="6" r=".5" fill="#fff"/><circle cx="6" cy="18" r=".5" fill="#fff"/>
        </svg>
      </div>
      <div class="name">DSH Desktop</div>
      <div class="tagline">DeepSeek Harness 桌面应用</div>
    </div>

    <div class="card">
      <div class="kv"><div class="k">应用版本</div><div class="v" id="infoApp">—</div></div>
      <div class="kv"><div class="k">DSH 运行时</div><div class="v" id="infoDsh">—</div></div>
      <div class="kv"><div class="k">平台</div><div class="v" id="infoPlatform">—</div></div>
    </div>

    <div class="row center">
      <button class="primary" id="btnCheck">检查更新</button>
      <button class="primary" id="btnInstall" hidden>下载并安装</button>
      <span class="msg" id="updateMsg"></span>
    </div>

    <div class="row center">
      <button id="btnRepo">项目主页</button>
      <button id="btnLog">打开日志</button>
      <button id="btnDir">数据目录</button>
    </div>

    <p class="note">日志与数据目录也可从托盘菜单打开；DSH 运行时可从托盘「升级 DSH 运行时」维护。</p>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;

  if (/Mac/i.test(navigator.userAgent)) document.body.classList.add('mac');

  /* ── 自绘关闭钮（无边框窗口；__TAURI__.window 全局可用） ── */
  const selfWin = window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow
    ? window.__TAURI__.window.getCurrentWindow() : null;
  if (selfWin) $('winClose').onclick = () => selfWin.close();

  function msg(text, cls) {
    const el = $('updateMsg');
    el.className = text ? `msg ${cls || ''}` : 'msg';
    el.textContent = text || '';
  }

  async function load() {
    try {
      const d = await invoke('about_info');
      $('infoApp').textContent = 'v' + (d.appVersion || '—');
      $('infoDsh').textContent = d.dshVersion ? 'v' + d.dshVersion : '未安装（启动时自动安装）';
      $('infoPlatform').textContent = d.platform || '—';
    } catch (e) {
      msg('信息读取失败：' + String(e), 'err');
    }
  }

  $('btnCheck').onclick = async () => {
    $('btnCheck').disabled = true;
    $('btnInstall').hidden = true;
    msg('正在检查更新…');
    try {
      const r = await invoke('about_check_update');
      if (r && r.latest) {
        msg(`发现新版本 v${r.latest}`, 'ok');
        $('btnInstall').hidden = false;
      } else {
        msg('已是最新版本', 'ok');
      }
    } catch (e) {
      msg('检查更新失败：' + String(e), 'err');
    } finally {
      $('btnCheck').disabled = false;
    }
  };

  $('btnInstall').onclick = async () => {
    $('btnInstall').disabled = true;
    $('btnCheck').disabled = true;
    msg('正在下载并安装…完成后将自动重启', '');
    try {
      await invoke('about_install_update'); // 成功即重启，通常不返回
    } catch (e) {
      msg('安装失败：' + String(e), 'err');
      $('btnInstall').disabled = false;
      $('btnCheck').disabled = false;
    }
  };

  $('btnRepo').onclick = () => { invoke('about_open_repo').catch((e) => msg('打开失败：' + String(e), 'err')); };
  $('btnLog').onclick = () => { invoke('open_log').catch((e) => msg('打开失败：' + String(e), 'err')); };
  $('btnDir').onclick = () => { invoke('open_runtime_dir').catch((e) => msg('打开失败：' + String(e), 'err')); };

  load();
</script>
</body>
</html>
