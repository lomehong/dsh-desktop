<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH 设置</title>
<style>
  /* ── 设计令牌：与 remote.html 同源（跟随系统深浅色，品牌渐变 #4a6cf7 → #7b5cf0） ── */
  :root {
    color-scheme: light;
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-hover: #eef1f6;
    --border: #e4e8ee;
    --border-strong: #cdd4de;
    --text-1: #131824;
    --text-2: #4c5666;
    --text-3: #8a93a5;
    --accent: #4a6cf7;
    --accent-strong: #3b5ce6;
    --accent-soft: rgba(74, 108, 247, .09);
    --accent-shadow: rgba(74, 108, 247, .28);
    --grad: linear-gradient(135deg, #4a6cf7, #7b5cf0);
    --ok: #15803d;
    --ok-soft: rgba(21, 128, 61, .08);
    --ok-border: rgba(21, 128, 61, .3);
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-md: 0 8px 24px rgba(16, 24, 40, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --surface: #161a22;
      --surface-hover: #1d232e;
      --border: #262d3a;
      --border-strong: #384152;
      --text-1: #e8ebf2;
      --text-2: #9aa4b5;
      --text-3: #69738a;
      --accent: #7b9bff;
      --accent-strong: #93aeff;
      --accent-soft: rgba(123, 155, 255, .12);
      --accent-shadow: rgba(74, 108, 247, .4);
      --ok: #45c48a;
      --ok-soft: rgba(69, 196, 138, .1);
      --ok-border: rgba(69, 196, 138, .3);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, .4);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; flex-direction: column;
    font-family: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    font-size: 13px; line-height: 1.5; color: var(--text-1);
    background: var(--bg);
    user-select: none;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  body.mac .titlebar { padding-left: 84px; } /* macOS 红绿灯在左，预留按钮区 */

  /* ── 标题栏（无边框窗口：拖拽区 + 自绘窗控钮） ── */
  .titlebar {
    flex: none; display: flex; align-items: center; gap: 12px;
    height: 48px; padding: 0 0 0 16px;
    border-bottom: 1px solid var(--border); background: var(--surface);
    user-select: none;
    -webkit-app-region: drag; /* Tauri 内核拖拽（配合 data-tauri-drag-region 属性双保险） */
  }
  .titlebar button { -webkit-app-region: no-drag; }
  .win-controls { display: flex; height: 48px; align-self: stretch; }
  .win-btn {
    width: 46px; height: 100%; border: none; border-radius: 0; background: none; cursor: pointer;
    color: var(--text-2); display: grid; place-items: center;
    -webkit-app-region: no-drag;
    transition: background .1s, color .1s;
    padding: 0;
  }
  .win-btn:hover { background: var(--surface-hover); color: var(--text-1); border: none; }
  .win-btn.close:hover { background: #e81123; color: #fff; }
  .win-btn svg { width: 12px; height: 12px; }
  .titlebar .glyph {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    background: var(--grad);
    box-shadow: 0 2px 8px var(--accent-shadow);
    display: grid; place-items: center;
  }
  .titlebar .glyph svg { width: 15px; height: 15px; }
  .titlebar .t { flex: 1; min-width: 0; }
  .titlebar h1 { font-size: 13px; font-weight: 650; margin: 0; }
  .titlebar .sub { color: var(--text-3); font-size: 11px; margin-top: 1px; }

  /* ── 内容滚动区 ── */
  main { flex: 1; overflow-y: auto; padding: 18px 22px 12px; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb {
    background: var(--border-strong); border-radius: 6px;
    border: 3px solid var(--bg); background-clip: padding-box;
  }
  section { margin-bottom: 22px; }
  .sec-h { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 10px; }
  .sec-h h2 { font-size: 12px; font-weight: 650; margin: 0; color: var(--text-2); letter-spacing: .3px; }
  .card {
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    box-shadow: var(--shadow-sm); padding: 14px 16px;
  }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px; border-radius: 8px; }
  .opt:hover { background: var(--surface-hover); }
  .opt input[type="radio"] { accent-color: var(--accent); margin-top: 3px; flex: none; }
  .opt label { flex: 1; cursor: pointer; }
  .opt .name { font-weight: 600; }
  .opt .desc { color: var(--text-3); font-size: 12px; }
  .port-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .port-row input[type="number"] {
    font: inherit; width: 110px; padding: 6px 8px;
    border: 1px solid var(--border-strong); border-radius: 8px;
    background: var(--surface); color: var(--text-1);
  }
  .port-row input[type="number"]:focus { border-color: var(--accent); outline: none; }
  .hint { color: var(--text-3); font-size: 12px; margin: 10px 4px 0; }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 0 4px; }
  button {
    font: inherit; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-1); border-radius: 8px; padding: 6px 16px; cursor: pointer;
    transition: color .12s, border-color .12s, background .12s;
  }
  button:hover { background: var(--surface-hover); }
  button.primary {
    border: none; background: var(--grad); color: #fff; font-weight: 600;
    box-shadow: 0 2px 8px var(--accent-shadow);
  }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 12px; opacity: 0; transition: opacity .15s; }
  .msg.show { opacity: 1; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: #dc2626; }
  .msg.muted { color: var(--text-3); }

  /* ── 运行时信息（只读行） ── */
  .kv { display: flex; gap: 12px; padding: 7px 4px; border-radius: 8px; }
  .kv:nth-child(odd) { background: var(--surface-hover); }
  .kv .k { width: 96px; flex: none; color: var(--text-3); font-size: 12px; padding-top: 1px; }
  .kv .v { flex: 1; min-width: 0; word-break: break-all; user-select: text; }
  .pill {
    font-size: 11px; border-radius: 999px; padding: 0 8px; line-height: 18px;
    border: 1px solid var(--border); color: var(--text-2); background: var(--surface);
  }
</style>
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="glyph" data-tauri-drag-region aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="6" rx="2"/><rect x="2" y="15" width="20" height="6" rx="2"/>
        <circle cx="6" cy="6" r=".5" fill="#fff"/><circle cx="6" cy="18" r=".5" fill="#fff"/>
      </svg>
    </div>
    <div class="t" data-tauri-drag-region>
      <h1 data-tauri-drag-region>DSH 设置</h1>
      <div class="sub" data-tauri-drag-region>启动配置 · 改动于下次启动服务时生效</div>
    </div>
    <!-- 自绘窗控钮（无边框窗口；不用 decorum——懒创建窗口里它的注入事件竞态丢失） -->
    <div class="win-controls">
      <button class="win-btn" id="winMin" aria-label="最小化" title="最小化">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="1" y1="6" x2="11" y2="6"/></svg>
      </button>
      <button class="win-btn" id="winMax" aria-label="最大化/还原" title="最大化/还原">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>
      </button>
      <button class="win-btn close" id="winClose" aria-label="关闭" title="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section>
      <div class="sec-h"><h2>服务端口</h2><span class="pill">dsh web 监听地址（仅本机回环）</span></div>
      <div class="card">
        <div class="opt">
          <input type="radio" name="portMode" id="modeRandom" value="random" checked />
          <label for="modeRandom">
            <div class="name">默认（随机端口）</div>
            <div class="desc">每次启动由系统分配空闲端口：零冲突，安全面最小。地址以会话内实际为准。</div>
          </label>
        </div>
        <div class="opt">
          <input type="radio" name="portMode" id="modeFixed" value="fixed" />
          <label for="modeFixed">
            <div class="name">固定端口</div>
            <div class="desc">URL 稳定，便于书签 / 外部脚本 / 防火墙规则。端口被占用时本次启动自动回退随机端口，绝不起不来。</div>
            <div class="port-row">
              <input type="number" id="portInput" min="1024" max="65535" placeholder="1024–65535" />
              <span class="desc">如 3080（dsh 官方默认端口）</span>
            </div>
          </label>
        </div>
        <div class="hint">保存后于<b>下次启动服务</b>时生效；要立即应用请用托盘菜单的「重启服务」。</div>
        <div class="actions">
          <button class="primary" id="btnSave">保存</button>
          <span class="msg" id="msg"></span>
        </div>
      </div>
    </section>

    <section>
      <div class="sec-h"><h2>运行时</h2><span class="pill">只读</span></div>
      <div class="card">
        <div class="kv"><div class="k">dsh 版本</div><div class="v" id="infoVersion">—</div></div>
        <div class="kv"><div class="k">数据目录</div><div class="v" id="infoRoot">—</div></div>
        <div class="kv"><div class="k">日志文件</div><div class="v" id="infoLog">—</div></div>
      </div>
    </section>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;

  if (/Mac/i.test(navigator.userAgent)) document.body.classList.add('mac');

  /* ── 自绘窗控钮（无边框窗口；__TAURI__.window 全局可用） ── */
  const selfWin = window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow
    ? window.__TAURI__.window.getCurrentWindow() : null;
  if (selfWin) {
    $('winMin').onclick = () => selfWin.minimize();
    $('winMax').onclick = () => selfWin.toggleMaximize();
    $('winClose').onclick = () => selfWin.close();
  }

  const SVG_MAX = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>';
  const SVG_RESTORE = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="3" width="8" height="8" rx="1"/><path d="M3 3V2a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-1"/></svg>';

  function msg(text, cls) {
    const el = $('msg');
    el.className = text ? `msg show ${cls || 'err'}` : 'msg';
    el.textContent = text || '';
  }

  function readForm() {
    if ($('modeFixed').checked) {
      const n = Number($('portInput').value);
      if (!Number.isInteger(n) || n < 1024 || n > 65535) {
        return { error: '固定端口需为 1024–65535 的整数' };
      }
      return { fixedPort: n };
    }
    return { fixedPort: null };
  }

  function fillForm(fixedPort) {
    if (fixedPort != null) {
      $('modeFixed').checked = true;
      $('portInput').value = String(fixedPort);
    } else {
      $('modeRandom').checked = true;
    }
  }

  async function load() {
    try {
      const d = await invoke('settings_load');
      fillForm(d.fixedPort ?? null);
      $('infoVersion').textContent = d.dshVersion ? 'v' + d.dshVersion : '未安装（启动时自动安装）';
      $('infoRoot').textContent = d.runtimeRoot || '—';
      $('infoLog').textContent = d.logFile || '—';
    } catch (e) {
      msg('配置读取失败：' + String(e), 'err');
    }
  }

  $('btnSave').onclick = async () => {
    const v = readForm();
    if (v.error) { msg(v.error, 'err'); return; }
    try {
      await invoke('settings_save', { fixedPort: v.fixedPort });
      msg(v.fixedPort ? `已保存：固定端口 ${v.fixedPort}（下次启动服务生效）` : '已保存：随机端口（下次启动服务生效）', 'ok');
    } catch (e) {
      msg('保存失败：' + String(e), 'err');
    }
  };

  // 端口语义提示：占用也能保存（启动时自动回退），此处仅提示不阻断
  load();
</script>
</body>
</html>
