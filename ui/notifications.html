<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>DSH 通知中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #1c2431; color: #e8ecf1;
    display: flex; flex-direction: column;
    user-select: none;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
    flex: none;
  }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
  header button {
    font-size: 12px; color: #aeb9c8; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
    padding: 5px 12px; cursor: pointer;
  }
  header button:hover { background: rgba(255,255,255,0.14); color: #fff; }
  #list { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }
  .item {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px 12px;
  }
  .item .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .item .title { font-size: 13px; font-weight: 600; color: #dfe6ef; }
  .item .time { font-size: 11px; color: #6d7a8a; flex: none; }
  .item .body { font-size: 12px; color: #aeb9c8; white-space: pre-wrap; word-break: break-all; }
  .empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #6d7a8a; font-size: 13px; flex-direction: column; gap: 8px;
  }
  .empty .icon { font-size: 34px; opacity: 0.5; }
</style>
</head>
<body>
  <header>
    <h1>通知中心</h1>
    <button id="btn-clear">清空</button>
  </header>
  <div id="list"></div>
  <script>
    const listEl = document.getElementById('list');
    const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
    const listen = window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.listen;

    function fmtTime(unix) {
      if (!unix) return '';
      const d = new Date(unix * 1000);
      const pad = n => String(n).padStart(2, '0');
      const today = new Date();
      const sameDay = d.toDateString() === today.toDateString();
      const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
      if (sameDay) return '今天 ' + hm;
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
    }

    function render(items) {
      if (!items.length) {
        listEl.innerHTML = '<div class="empty"><div class="icon">🔔</div><div>暂无通知</div></div>';
        return;
      }
      listEl.innerHTML = '';
      for (const it of items) {
        const div = document.createElement('div');
        div.className = 'item';
        const row = document.createElement('div');
        row.className = 'row';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = it.title || '';
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = fmtTime(it.at);
        row.appendChild(title); row.appendChild(time);
        const body = document.createElement('div');
        body.className = 'body';
        body.textContent = it.body || '';
        div.appendChild(row); div.appendChild(body);
        listEl.appendChild(div);
      }
    }

    async function refresh() {
      if (!invoke) return;
      try { render(await invoke('get_notifications')); } catch (e) {}
    }

    document.getElementById('btn-clear').onclick = async () => {
      if (invoke) { try { await invoke('clear_notifications'); } catch (e) {} }
      render([]);
    };

    if (listen) { listen('notifications-updated', () => refresh()); }
    refresh();
  </script>
</body>
</html>
